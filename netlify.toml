# Netlify Configuration for Sunset Glow Lighting

[build]
  base    = "SGL.Website"  # cd into this folder
  publish = "."            # publish THIS folder (not /dist)
  command = "echo 'Deploying static site...'"

[build.environment]
  # Ensure Node.js is available if needed in the future
  NODE_VERSION = "18"

# Environment variables for production
[context.production.environment]
  SUPABASE_URL = "your-supabase-url"
  SUPABASE_ANON_KEY = "your-supabase-anon-key"
  EMAIL_USER = "your-email@gmail.com"
  EMAIL_PASS = "your-app-password"
  BUSINESS_EMAIL = "business@sunsetglowlighting.com"
  CALENDLY_WEBHOOK_SECRET = "your-calendly-webhook-secret"

# Redirect rules
[[redirects]]
  # Redirect www to non-www (or vice versa if preferred)
  from = "https://www.sunsetglowlighting.com/*"
  to = "https://sunsetglowlighting.com/:splat"
  status = 301
  force = true

# SPA fallback is not needed for this multi-page HTML site
# But we handle 404 properly
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# HTML files - shorter cache for content updates
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

