<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Sunset Glow Lighting</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <style>
        .not-found { padding: 6rem 0; text-align: center; }
        .not-found h1 { font-size: clamp(2rem, 6vw, 3rem); margin-bottom: 1rem; }
        .not-found p { color: var(--ink-light); margin-bottom: 2rem; }
    </style>
    <script>
      // Netlify/Vercel compatible redirect back to homepage after a delay
      setTimeout(function(){ window.location.href = '/index.html'; }, 6000);
    </script>
  </head>
<body>
    <main id="main">
        <section class="not-found">
            <div class="container">
                <h1>404 — Page not found</h1>
                <p>The page you’re looking for doesn’t exist. Taking you back home…</p>
                <a class="btn btn-primary" href="/index.html">Go to Homepage</a>
            </div>
        </section>
    </main>
</body>
</html>
