<!-- Contact/Quote Form -->
<form name="Quote"
      method="POST"
      action="/thanks.html"
      data-netlify="true"
      netlify-honeypot="bot-field">

  <!-- Netlify internal fields -->
  <input type="hidden" name="form-name" value="Quote">
  <p class="hidden">
    <label>Don’t fill this out: <input name="bot-field"></label>
  </p>

  <!-- Contact / Address -->
  <div class="form-group">
    <label for="name" class="form-label">Full Name <span class="required">*</span></label>
    <input type="text" id="name" name="name" class="form-input" required>
  </div>

  <div class="form-group">
    <label for="address" class="form-label">Street Address <span class="required">*</span></label>
    <input type="text" id="address" name="address" class="form-input" required>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="city" class="form-label">City <span class="required">*</span></label>
      <input type="text" id="city" name="city" class="form-input" required>
    </div>
    <div class="form-group">
      <label for="state" class="form-label">State <span class="required">*</span></label>
      <input type="text" id="state" name="state" class="form-input" value="TX" maxlength="2" required>
    </div>
    <div class="form-group">
      <label for="zip" class="form-label">ZIP <span class="required">*</span></label>
      <input type="text" id="zip" name="zip" class="form-input" required pattern="\d{5}">
    </div>
  </div>

  <div class="form-group">
    <label for="home_type" class="form-label">Home Type <span class="required">*</span></label>
    <select id="home_type" name="home_type" class="form-input" required>
      <option value="">Select…</option>
      <option>1-Story</option>
      <option>2-Story</option>
      <option>3-Story</option>
      <option>Ranch</option>
    </select>
  </div>

  <div class="form-group">
    <label for="phone" class="form-label">Phone <span class="required">*</span></label>
    <input type="tel" id="phone" name="phone" class="form-input" required>
  </div>

  <div class="form-group">
    <label for="email" class="form-label">Email <span class="required">*</span></label>
    <input type="email" id="email" name="email" class="form-input" required>
  </div>

  <!-- Scheduling -->
  <div class="form-group">
    <label for="install_date" class="form-label">Preferred Install Date <span class="required">*</span></label>
    <input type="date" id="install_date" name="install_date" class="form-input" required>
  </div>

  <div class="form-group">
    <label for="timeframe_flex" class="form-label">Date Flexibility</label>
    <select id="timeframe_flex" name="timeframe_flex" class="form-input">
      <option value="">Select…</option>
      <option>Exact date</option>
      <option>±3 days OK</option>
      <option>First available</option>
    </select>
  </div>

  <!-- Project Intent -->
  <div class="form-group">
    <p class="form-label">Tell us what you’re looking for <span class="required">*</span></p>
    <label><input type="checkbox" name="intent_scope[]" value="Roofline" required> Roofline</label>
    <label><input type="checkbox" name="intent_scope[]" value="Trees"> Trees</label>
    <label><input type="checkbox" name="intent_scope[]" value="Bushes/Shrubs"> Bushes/Shrubs</label>
    <label><input type="checkbox" name="intent_scope[]" value="Windows/Doors"> Windows/Doors</label>
    <label><input type="checkbox" name="intent_scope[]" value="Pathway/Stakes"> Pathway/Stakes</label>
    <label><input type="checkbox" name="intent_scope[]" value="Wreaths/Garland"> Wreaths/Garland</label>
    <label><input type="checkbox" name="intent_scope[]" value="Take-down + Storage"> Take-down + Storage</label>
    <label><input type="checkbox" name="intent_scope[]" value="Custom"> Custom</label>
  </div>

  <div class="form-group">
    <label for="details" class="form-label">Describe your custom request or special notes</label>
    <textarea id="details" name="details" class="form-input" rows="4"></textarea>
  </div>

  <!-- Photo uploads (Netlify: one file per field [oai_citation:1‡docs.netlify.com](https://docs.netlify.com/manage/forms/setup/#:~:text=Keep%20the%20following%20considerations%20in,with%20file%20uploads%20in%20forms)) -->
  <div class="form-group">
    <label class="form-label">Upload photos of your home (optional)</label>
    <input type="file" name="photo1" accept="image/*">
    <input type="file" name="photo2" accept="image/*">
    <input type="file" name="photo3" accept="image/*">
  </div>

  <!-- Consent -->
  <div class="form-group">
    <label><input type="checkbox" id="sms_ok" name="sms_ok" value="yes"> I agree to receive scheduling updates by SMS</label>
  </div>

  <!-- Hidden attribution fields for marketing and geo-hooks -->
  <input type="hidden" name="utm_source" id="utm_source">
  <input type="hidden" name="utm_medium" id="utm_medium">
  <input type="hidden" name="utm_campaign" id="utm_campaign">
  <input type="hidden" name="gclid" id="gclid">
  <input type="hidden" name="fbclid" id="fbclid">
  <input type="hidden" name="page_url" id="page_url">
  <input type="hidden" name="referrer" id="referrer">
  <input type="hidden" name="lat" id="lat">
  <input type="hidden" name="lng" id="lng">

  <button type="submit" class="btn btn-primary">Request Quote</button>
</form>
